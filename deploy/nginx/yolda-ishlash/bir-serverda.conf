# IXTIYORIY. Tizimni boshqa sayt ichida, yo'lda ochish (misol: https://dist.karsu.uz/zoom),
# tizim o'sha sayt bilan BIR serverda bo'lsa. Asosiy o'rnatish uchun kerak emas (mt.regofis.uz.conf).
# Bu bloklarni mavjud dist.karsu.uz "server { listen 443 ... }" ichiga qo'shing
# (yoki faylni /etc/nginx/snippets/ ga qo'yib, server ichida: include snippets/bir-serverda.conf;).
#
# Kod: /mnt/projects/sites/regofis.uz/mt.regofis.uz (backend/ va frontend/dist). deploy.sh frontendni /zoom/ uchun o'zi yig'adi.
# .env: APP_URL=https://dist.karsu.uz/zoom, SESSION_PATH=/zoom, RECORDINGS_ACCEL_PREFIX=/_zoom_recordings/

location = /zoom {
    return 301 /zoom/;
}

# Laravel: API, HEMIS OAuth, Sanctum, Telegram "Darsni boshlash" havolalari, health-check.
# SCRIPT_NAME=/zoom/index.php — Laravel o'zi /zoom yo'lini tushunadi (marshrutlar o'zgarmaydi).
location ~ ^/zoom/(api|auth|sanctum|l|up)(/|$) {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_param SCRIPT_FILENAME /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/public/index.php;
    fastcgi_param SCRIPT_NAME /zoom/index.php;
    fastcgi_param DOCUMENT_ROOT /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/public;
    fastcgi_hide_header X-Powered-By;
    fastcgi_read_timeout 60s;
}

# Video yozuvlar: Laravel ruxsatni tekshiradi, faylni nginx beradi (ichki manzil, tashqaridan ochilmaydi).
location /_zoom_recordings/ {
    internal;
    alias /var/www/recordings/;
}

# Vite build fayllari (nomida hash bor — uzoq keshlash xavfsiz).
location /zoom/assets/ {
    alias /mnt/projects/sites/regofis.uz/mt.regofis.uz/frontend/dist/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# React ilovasi: qolgan barcha /zoom/... manzillar index.html ga.
location /zoom/ {
    alias /mnt/projects/sites/regofis.uz/mt.regofis.uz/frontend/dist/;
    expires -1;
    try_files $uri $uri/ /zoom/index.html;
}
