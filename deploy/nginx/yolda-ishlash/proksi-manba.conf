# IXTIYORIY, faqat proksi.conf bilan birga. Asosiy o'rnatishda bu faylni ISHLATMANG — mt.regofis.uz.conf.
# mt.regofis.uz — tizim turgan server (manba). Foydalanuvchilar uni https://dist.karsu.uz/zoom orqali ochadi:
# dist.karsu.uz proksi qiladi (proksi.conf). mt.regofis.uz o'z SSL guvohnomasiga ega.
# To'g'ridan-to'g'ri mt.regofis.uz ga kirganlar (eski xatcho'plar) dist.karsu.uz/zoom ga yo'naltiriladi.
# Frontend /zoom/ uchun yig'iladi (deploy.sh APP_URL'dan o'zi oladi).
# .env: APP_URL=https://dist.karsu.uz/zoom, SESSION_PATH=/zoom, TRUSTED_PROXIES=<dist.karsu.uz IP>.

# Proksi orqali kelgan so'rovda X-Forwarded-Prefix: /zoom bo'ladi; qolganlari — to'g'ridan-to'g'ri kirish.
map $http_x_forwarded_prefix $zoom_direct {
    "/zoom"  0;
    default  1;
}

server {
    listen 80;
    listen [::]:80;
    server_name mt.regofis.uz;
    return 301 https://$host$request_uri;
}

server {
    # "listen ... http2" nginx 1.24 (Ubuntu 24.04) va yangilarida ishlaydi.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mt.regofis.uz;

    ssl_certificate     /etc/letsencrypt/live/mt.regofis.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt.regofis.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # To'g'ridan-to'g'ri kirish -> asosiy manzil (Telegram'dagi eski havolalar ham shu yerga keladi).
    if ($zoom_direct) {
        return 301 https://dist.karsu.uz/zoom$request_uri;
    }

    root /mnt/projects/sites/regofis.uz/mt.regofis.uz/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 5m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Laravel: API, HEMIS OAuth, Sanctum CSRF, Telegram "Darsni boshlash" havolalari, health-check
    location ~ ^/(api|auth|sanctum|l|up)(/|$) {
        root /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Video yozuvlar: Laravel ruxsatni tekshiradi, faylni nginx beradi (.env: RECORDINGS_ACCEL_PREFIX=/_zoom_recordings/).
    location /_zoom_recordings/ {
        internal;
        alias /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/storage/app/recordings/;
    }

    # Vite build fayllari nomida hash bor — uzoq keshlash xavfsiz.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: barcha boshqa manzillar index.html'ga (keshlanmaydi).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
