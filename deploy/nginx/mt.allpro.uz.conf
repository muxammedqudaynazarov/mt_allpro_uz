# /etc/nginx/sites-available/mt.allpro.uz
# Frontend (React build) va backend (Laravel API) bitta domenda ishlaydi.
# APP_DIR o'zgarsa, quyidagi /var/www/mt.allpro.uz yo'llarini almashtiring.

server {
    listen 80;
    listen [::]:80;
    server_name mt.allpro.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mt.allpro.uz;

    ssl_certificate     /etc/letsencrypt/live/mt.allpro.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt.allpro.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/mt.allpro.uz/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 5m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Laravel: API, HEMIS OAuth, Sanctum CSRF, Telegram "Darsni boshlash" havolalari, health-check
    location ~ ^/(api|auth|sanctum|l|up)(/|$) {
        root /var/www/mt.allpro.uz/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        root /var/www/mt.allpro.uz/backend/public;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Vite build fayllari nomida hash bor — uzoq keshlash xavfsiz.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: barcha boshqa manzillar index.html'ga (keshlanmaydi).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
