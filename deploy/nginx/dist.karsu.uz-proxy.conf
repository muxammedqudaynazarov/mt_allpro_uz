# https://dist.karsu.uz/zoom — tizim BOSHQA serverda (masalan, mt.regofis.uz), dist.karsu.uz uni proksi qiladi.
#
# 1) dist.karsu.uz serveridagi "server { listen 443 ... }" ichiga:

location = /zoom {
    return 301 /zoom/;
}

location /zoom/ {
    # Oxiridagi "/" muhim: /zoom/api/x → https://mt.regofis.uz/api/x
    proxy_pass https://mt.regofis.uz/;
    proxy_set_header Host mt.regofis.uz;
    # mt.regofis.uz guvohnomasi tekshiriladi: serverlar orasidagi trafikni hech kim almashtira olmaydi.
    proxy_ssl_server_name on;
    proxy_ssl_name mt.regofis.uz;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    # HSTS siyosatini dist.karsu.uz egalari belgilaydi — tizim uni universitet domeniga o'rnatmaydi.
    proxy_hide_header Strict-Transport-Security;
    # Laravel havolalarni https://dist.karsu.uz/zoom/... ko'rinishida yaratishi uchun.
    proxy_set_header X-Forwarded-Host dist.karsu.uz;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix /zoom;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    # Video ijrosi va yuklab olish (katta fayllar, Range so'rovlari).
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 5m;
}

# 2) Tizim serverida (mt.regofis.uz): mt.regofis.uz-origin.conf (o'z guvohnomasi bilan). Unda
#    - frontend /zoom/ uchun yig'iladi (deploy.sh APP_URL'dan o'zi oladi; fayllar /zoom/assets/... deb so'raladi,
#      proksi /zoom ni olib tashlab /assets/... ga yuboradi — mos keladi);
#    - .env: APP_URL=https://dist.karsu.uz/zoom, FRONTEND_URL=https://dist.karsu.uz/zoom,
#      SESSION_PATH=/zoom, TRUSTED_PROXIES=<dist.karsu.uz serverining IP manzili>.
#    mt.regofis.uz to'g'ridan-to'g'ri ochilsa — https://dist.karsu.uz/zoom ga yo'naltiriladi.
