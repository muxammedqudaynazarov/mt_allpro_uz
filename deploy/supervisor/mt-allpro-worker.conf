; /etc/supervisor/conf.d/mt-allpro-worker.conf
; Navbat (queue) ishchisi: Telegram xabarlarini yuboradi.
[program:mt-allpro-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/mnt/projects/sites/regofis.uz/mt.regofis.uz/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/mnt/projects/sites/regofis.uz/mt.regofis.uz/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
